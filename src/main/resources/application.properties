spring.application.name=seat-reservation

spring.datasource.url=jdbc:mysql://localhost:3307/seats
spring.datasource.username=root
spring.datasource.password=root
spring.sql.init.mode=always

management.endpoints.web.exposure.include=health,prometheus,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
app.admin-token=${ADMIN_TOKEN:admin-secret}# under a stampede, most threads sit waiting for a DB connection or a row lock,
# so the pool has to be big enough and patient enough (MySQL default max_connections is 151)
spring.datasource.hikari.maximum-pool-size=40
spring.datasource.hikari.connection-timeout=60000
server.tomcat.threads.max=200
server.tomcat.accept-count=1000
